# earmark documentation site — https://jhelvy.github.io/earmark
#
# The site is generated by great-docs (a Quarto project is synthesized into the
# gitignored great-docs/ directory on every build). This file is the only
# committed configuration; there is no _quarto.yml to edit.
#
#   great-docs build       render the site
#   great-docs preview     local server with live reload
#
# Every option not set here keeps its default. `great-docs config` prints the
# full annotated template.

module: earmark
display_name: earmark
dynamic: false

repo: https://github.com/jhelvy/earmark
site_url: https://jhelvy.github.io/earmark

# earmark is a command-line tool, not a library — nobody writes
# `import earmark`. The reference section is the seven commands and the
# earmark.toml keys, hand-written under docs/reference/, so the generated
# Python API reference is off. Leaving it on would also mean importing the
# package (and so kokoro-onnx and numpy) just to build the docs.
reference: false
pypi: false
package_info_page: false
changelog:
  enabled: false

authors:
  - name: John Paul Helveston
    role: Author
    email: john.helveston@gmail.com

logo:
  light: docs/logo.png

hero:
  tagline: "Turn the things you meant to read into a private podcast feed."

sections:
  - title: Reference
    dir: reference
    navbar_after: "User Guide"

dark_mode_toggle: true
