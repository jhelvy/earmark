# earmark documentation site: https://jhelvy.github.io/earmark
#
# The site is generated by great-docs (a Quarto project is synthesized into the
# gitignored great-docs/ directory on every build). This file is the only
# committed configuration; there is no _quarto.yml to edit.
#
#   great-docs build       render the site
#   great-docs preview     local server with live reload
#
# Every option not set here keeps its default. `great-docs config` prints the
# full annotated template.

module: earmark
display_name: earmark
dynamic: false

repo: https://github.com/jhelvy/earmark
site_url: https://jhelvy.github.io/earmark

# earmark is a command-line tool, not a library. Nobody writes
# `import earmark`. The reference section is the seven commands and the
# earmark.toml keys, hand-written under docs/reference/, so the generated
# Python API reference is off. Leaving it on would also mean importing the
# package (and so kokoro-onnx and numpy) just to build the docs.
reference: false
pypi: false
package_info_page: false
changelog:
  enabled: false

authors:
  - name: John Paul Helveston
    role: Author
    email: john.helveston@gmail.com

logo:
  light: docs/logo.png

# The hex logo is transparent and 1.1 MB, so it cannot serve as a link preview
# on its own. assets/social-card.png is that logo flattened onto the hex's own
# cream at the 1200x630 every platform expects. Regenerate it with:
#
#   ffmpeg -y -f lavfi -i color=c=0xf5f1ea:s=1200x630 -i docs/logo.png \
#     -filter_complex "[1:v]scale=-1:530[fg];[0:v][fg]overlay=(W-w)/2:(H-h)/2,format=yuv420p" \
#     -frames:v 1 assets/social-card.png
#
# The URL has to be absolute. A relative `image:` is copied to the build root,
# which Quarto does not treat as a resource, so it never reaches _site and the
# tag 404s. assets/ is a resource directory, so this path is really served.
social_cards:
  image: https://jhelvy.github.io/earmark/assets/social-card.png
  twitter_card: summary_large_image

# Quarto already suffixes every subpage title with the site name, so the
# default "{page_title} | {site_name}" appends it a second time: the landing
# page renders "earmark | earmark" and Quickstart renders
# "Quickstart - earmark | earmark". Leaving Quarto's own title alone is right.
seo:
  title_template: "{page_title}"

hero:
  tagline: "Turn the things you meant to read into a private podcast feed."

sections:
  - title: Reference
    dir: reference
    navbar_after: "User Guide"

dark_mode_toggle: true
